<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#F7F5F2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="吃吧 — 减脂也可以放心吃外卖。热量计算交给我们，你只管下单。" />
  <link rel="manifest" href="./manifest.webmanifest?v=39" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/brand/favicon-32.png" />
  <link rel="apple-touch-icon" href="./assets/brand/apple-touch-icon.png" />
  <!--
    v2 redesign: system font stack only (PingFang SC / SF Pro). No webfonts —
    zero network dependency, instant paint everywhere, native app feel.
  -->
  <link rel="stylesheet" href="./styles/main.css?v=39" />
  <title>吃吧 · EAT</title>
</head>
<body>
  <!--
    整个 App 是一个 iPhone 视觉比例的容器：
    - 移动端全屏
    - 桌面端居中，模拟 390 × 844 (iPhone 14 Pro) 的画布
  -->
  <div class="device" id="device">
    <div class="status-bar" aria-hidden="true">
      <span class="status-time" id="statusTime">9:41</span>
      <span class="status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="none" aria-hidden="true">
          <path d="M1 8.5V10H2.5V8.5H1ZM4.5 6.5V10H6V6.5H4.5ZM8 4.5V10H9.5V4.5H8ZM11.5 2.5V10H13V2.5H11.5ZM15 0.5V10H16.5V0.5H15Z" fill="currentColor"/>
        </svg>
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none" aria-hidden="true">
          <path d="M8 10.5L11 7.5C10.2 6.7 9.15 6.25 8 6.25C6.85 6.25 5.8 6.7 5 7.5L8 10.5ZM8 4C9.7 4 11.25 4.65 12.4 5.7L13.8 4.3C12.3 2.85 10.25 2 8 2C5.75 2 3.7 2.85 2.2 4.3L3.6 5.7C4.75 4.65 6.3 4 8 4ZM8 0C10.75 0 13.3 1.05 15.2 2.8L16 2C13.9 0.75 11.05 0 8 0C4.95 0 2.1 0.75 0 2L0.8 2.8C2.7 1.05 5.25 0 8 0Z" fill="currentColor" transform="translate(0 0.5) scale(0.94)"/>
        </svg>
        <svg width="27" height="12" viewBox="0 0 27 12" fill="none" aria-hidden="true">
          <rect x="0.5" y="0.5" width="22" height="11" rx="3" stroke="currentColor" stroke-opacity="0.4"/>
          <rect x="2" y="2" width="17" height="8" rx="2" fill="currentColor"/>
          <path d="M24 4V8C25 7.7 25.5 6.9 25.5 6C25.5 5.1 25 4.3 24 4Z" fill="currentColor" fill-opacity="0.4"/>
        </svg>
      </span>
    </div>

    <main class="screen-root" id="screenRoot" role="main">
      <!-- Screens are injected by app.js -->
    </main>

    <nav class="tab-bar" id="tabBar" aria-label="主导航">
      <button class="tab" data-tab="today" aria-label="今天">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 2"/>
        </svg>
        <span>今天</span>
      </button>
      <button class="tab tab-primary" data-tab="meal" aria-label="这顿怎么样">
        <span class="tab-primary-inner">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 3v8a3 3 0 0 0 6 0V3"/>
            <path d="M7 11v10"/>
            <path d="M17 3c-1.5 2-2 4-2 7h4c0-3-0.5-5-2-7z"/>
            <path d="M17 10v11"/>
          </svg>
        </span>
      </button>
      <button class="tab" data-tab="next" aria-label="下一顿">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12h16a8 8 0 0 1-16 0z"/>
          <path d="M8 8c0-1.5 1-2 1-3.5M13 8c0-1.5 1-2 1-3.5"/>
        </svg>
        <span>下一顿</span>
      </button>
    </nav>

    <div class="home-indicator" aria-hidden="true"></div>
  </div>

  <script type="module" src="./src/app.js?v=39"></script>
</body>
</html>
